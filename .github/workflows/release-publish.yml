name: Release Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Required for latest; ignored for beta (beta tag is generated)"
        required: false
        type: string
      confirm_version:
        description: "Required for latest; ignored for beta"
        required: false
        type: string
      mode:
        description: "dry-run validates only; publish performs npm publication"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      dist_tag:
        description: "Publish channel: beta for verification, latest goes straight to users"
        required: true
        default: beta
        type: choice
        options:
          - beta
          - latest

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dist_tag == 'beta' && 'main' || inputs.release_tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install --global npm@11.21.3
          npm --version

      - name: Fetch main
        run: git fetch origin main:refs/remotes/origin/main --force

      - name: Resolve release version
        id: version
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          if [ "$DIST_TAG" = "beta" ]; then
            VERSION=$(node scripts/release/prepare-beta-version.mjs --print)
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          MODE: ${{ inputs.mode }}
          DIST_TAG: ${{ inputs.dist_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$DIST_TAG" = "beta" ]; then
            node scripts/release/preflight-publish.mjs --version "$VERSION" --mode "$MODE" --dist-tag beta
          else
            node scripts/release/preflight-publish.mjs --version "$VERSION" --tag "$RELEASE_TAG" --confirm "$CONFIRM_VERSION" --mode "$MODE" --dist-tag latest
          fi

  build:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dist_tag == 'beta' && needs.preflight.outputs.source_sha || inputs.release_tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install --global npm@11.21.3
          npm --version

      - name: Apply generated beta version
        if: inputs.dist_tag == 'beta'
        run: node scripts/release/prepare-beta-version.mjs --version "${{ needs.preflight.outputs.version }}"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build release artifacts
        run: npm run release:prepare

      - name: Verify release artifacts
        run: npm run release:verify

      - name: Generate checksums
        run: sha256sum release-artifacts/*.tgz > release-artifacts/SHA256SUMS

      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: release-candidates
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - preflight
      - build
    if: inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dist_tag == 'beta' && needs.preflight.outputs.source_sha || inputs.release_tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install --global npm@11.21.3
          npm --version

      - name: Download release candidates
        uses: actions/download-artifact@v4
        with:
          name: release-candidates
          path: release-artifacts

      - name: Verify downloaded checksums
        run: sha256sum -c release-artifacts/SHA256SUMS

      - name: Create beta release tag
        if: inputs.dist_tag == 'beta'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists" >&2
            exit 1
          fi
          git tag -a "$TAG" -m "beta release $VERSION"
          git push origin "$TAG"

      - name: Publish packages to selected dist-tag
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          npm publish "./release-artifacts/context-cpx-${VERSION}.tgz" --tag "$DIST_TAG" --access public --provenance
          npm publish "./release-artifacts/cannbot-proxy-${VERSION}.tgz" --tag "$DIST_TAG" --access public --provenance

      - name: Verify selected dist-tag
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: node scripts/release/verify-registry.mjs --tag "$DIST_TAG" --version "$VERSION" --wait-seconds 300 --poll-seconds 15
